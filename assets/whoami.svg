<svg viewBox="0 0 1000 268" width="1000" height="268" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Pheeraphat">
<style>
.m{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.r{opacity:0;animation:r .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1}.blink{animation:none}}
</style>
<text class="m r" style="animation-delay:0.10s" x="48" y="32" font-size="16" fill="#1F2328" >I build the money-and-tax parts of a cloud accounting platform for Thai SMEs.</text><text class="m r" style="animation-delay:0.20s" x="48" y="60" font-size="16" fill="#1F2328" >Mostly .NET services behind Angular, iOS and Android clients, from schema to rollout.</text><text class="m r" style="animation-delay:0.30s" x="48" y="88" font-size="15" fill="#59636E" >I like boring, reversible deploys: feature flags, characterization tests, runbooks.</text><line class="r" style="animation-delay:0.40s" x1="48" y1="108" x2="952" y2="108" stroke="#D0D7DE" stroke-width="1"/><text class="m r" style="animation-delay:0.10s" x="48" y="142" font-size="11" fill="#59636E" letter-spacing="2.5">FOCUS</text><text class="m r" style="animation-delay:0.10s" x="198" y="142" font-size="15" fill="#1F2328" >tax compliance · billing &amp; subscriptions · caching · AI-augmented SDLC</text><text class="m r" style="animation-delay:0.22s" x="48" y="176" font-size="11" fill="#59636E" letter-spacing="2.5">NOW</text><text class="m r" style="animation-delay:0.22s" x="198" y="176" font-size="15" fill="#0969DA" >electronic tax documents — signing, batch submission, cancellation flows</text><text class="m r" style="animation-delay:0.34s" x="48" y="210" font-size="11" fill="#59636E" letter-spacing="2.5">SCHOOL</text><text class="m r" style="animation-delay:0.34s" x="198" y="210" font-size="15" fill="#1F2328" >Mahidol University</text><text class="m r" style="animation-delay:0.46s" x="48" y="244" font-size="11" fill="#59636E" letter-spacing="2.5">HABITS</text><text class="m r" style="animation-delay:0.46s" x="198" y="244" font-size="15" fill="#1F2328" >test first · design doc before code · small, single-purpose PRs</text>
</svg>
