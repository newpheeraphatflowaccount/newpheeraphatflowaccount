<svg viewBox="0 0 1000 180" width="1000" height="180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pheeraphat Prisan — software engineer">
<style>
.m{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.r{opacity:0;animation:r .7s cubic-bezier(.2,.7,.2,1) forwards}
