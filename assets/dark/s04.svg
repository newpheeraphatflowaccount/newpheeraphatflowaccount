<svg viewBox="0 0 1000 48" width="1000" height="48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="04 — telemetry">
<style>
.m{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.r{opacity:0;animation:r .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1}.blink{animation:none}}
</style>
<text class="m r" style="animation-delay:0.00s" x="48" y="34" font-size="13" fill="#4493F8" letter-spacing="2">04</text><text class="m r" style="animation-delay:0.00s" x="84" y="34" font-size="13" fill="#656C76" >—</text><text class="m r" style="animation-delay:0.00s" x="110" y="34" font-size="13" fill="#9198A1" letter-spacing="3">telemetry</text><line x1="216" y1="30" x2="952" y2="30" stroke="#3D444D" stroke-width="1"/>
</svg>
