<svg viewBox="0 0 1000 396" width="1000" height="396" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What I ship at work">
<style>
.m{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.r{opacity:0;animation:r .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1}.blink{animation:none}}
</style>
<text class="m r" style="animation-delay:0.10s" x="48" y="36" font-size="13" fill="#4493F8" >[1]</text><text class="m r" style="animation-delay:0.10s" x="90" y="36" font-size="16" fill="#E6EDF3" font-weight="600">Electronic tax documents</text><text class="m r" style="animation-delay:0.10s" x="90" y="60" font-size="14" fill="#9198A1" >digitally signed invoices and receipts sent to the tax authority,</text><text class="m r" style="animation-delay:0.10s" x="90" y="80" font-size="14" fill="#9198A1" >queue-based worker pipeline, batch submit/cancel, audit trail</text><text class="m r" style="animation-delay:0.22s" x="48" y="114" font-size="13" fill="#4493F8" >[2]</text><text class="m r" style="animation-delay:0.22s" x="90" y="114" font-size="16" fill="#E6EDF3" font-weight="600">Profile API migration</text><text class="m r" style="animation-delay:0.22s" x="90" y="138" font-size="14" fill="#9198A1" >per-field Redis cache, commit-then-invalidate,</text><text class="m r" style="animation-delay:0.22s" x="90" y="158" font-size="14" fill="#9198A1" >flag-gated rollout across many consumers within a latency budget</text><text class="m r" style="animation-delay:0.34s" x="48" y="192" font-size="13" fill="#4493F8" >[3]</text><text class="m r" style="animation-delay:0.34s" x="90" y="192" font-size="16" fill="#E6EDF3" font-weight="600">Usage-based billing</text><text class="m r" style="animation-delay:0.34s" x="90" y="216" font-size="14" fill="#9198A1" >metered usage events, live usage updates in the app,</text><text class="m r" style="animation-delay:0.34s" x="90" y="236" font-size="14" fill="#9198A1" >add-on gating and quota handling</text><text class="m r" style="animation-delay:0.46s" x="48" y="270" font-size="13" fill="#4493F8" >[4]</text><text class="m r" style="animation-delay:0.46s" x="90" y="270" font-size="16" fill="#E6EDF3" font-weight="600">Onboarding &amp; permissions</text><text class="m r" style="animation-delay:0.46s" x="90" y="294" font-size="14" fill="#9198A1" >identity verification, team invites, role permissions —</text><text class="m r" style="animation-delay:0.46s" x="90" y="314" font-size="14" fill="#9198A1" >one rule set shipped to web, iOS and Android</text><text class="m r" style="animation-delay:0.58s" x="48" y="348" font-size="13" fill="#4493F8" >[5]</text><text class="m r" style="animation-delay:0.58s" x="90" y="348" font-size="16" fill="#E6EDF3" font-weight="600">Agentic SDLC tooling</text><text class="m r" style="animation-delay:0.58s" x="90" y="372" font-size="14" fill="#9198A1" >Claude Code agent teams driving design docs, TDD loops,</text><text class="m r" style="animation-delay:0.58s" x="90" y="392" font-size="14" fill="#9198A1" >PR review and deploy runbooks</text>
</svg>
